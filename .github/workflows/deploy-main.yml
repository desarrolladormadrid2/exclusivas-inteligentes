name: Deploy production to miniPC

on:
  push:
    branches:
      - main

concurrency:
  group: exclusivas-inteligentes-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: powershell -ExecutionPolicy Bypass -File {0}

jobs:
  deploy:
    runs-on: [self-hosted, Windows, exclusivas-inteligentes]
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install dependencies
        shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"
        run: npm ci

      - name: Run tests
        shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"
        run: npm test

      - name: Build production bundle
        shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"
        run: npm run build

      - name: Validate production version
        shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"
        run: .\scripts\check-production-version.ps1

      - name: Deploy and restart CRM
        shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"
        run: .\scripts\deploy-production.ps1

      - name: Verify production endpoints
        shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"
        run: .\scripts\verify-production.ps1
